name: Verify MCP
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked remote dependencies
        run: npm ci --no-audit --no-fund
      - name: Check syntax, remote MCP and auth tests
        run: npm run check && npm test
      - name: Dependency security
        run: npm run audit:check
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Studio package
        run: python -m pip install ./studio
      - name: Check Python sources
        run: python -m compileall -q studio/src studio/Build.py
      - name: Real FastMCP flow and REST boundary tests
        run: |
          cd studio
          python -m unittest discover -s tests -p '*Test.py' -v
      - name: Verify wheel build
        run: |
          python -m pip install build
          python -m build --wheel studio --outdir /tmp/nuwa-wheel
