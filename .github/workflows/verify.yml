name: Verify MCP
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Test OAuth, API, tools and real stdio MCP
        run: npm test
      - name: Dependency audit (high and critical)
        run: npm run audit:check
