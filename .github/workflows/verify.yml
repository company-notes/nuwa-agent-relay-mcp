name: Verify Server and Studio MCP

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Remote MCP TypeScript
        run: npm run check
      - name: Server OAuth and MCP tests
        run: npm test
      - name: Cloudflare Worker bundle
        run: npm run build
      - run: npm run audit:check

  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Studio FastMCP and test deps
        run: pip install -e './studio[dev]'
      - name: Check Python imports and style
        run: ruff check studio/src --select E4,E7,E9,F
      - name: Python Studio tests
        run: pytest -q studio/tests
