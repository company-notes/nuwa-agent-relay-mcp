name: Verify Server and Studio MCP

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Remote MCP TypeScript
        run: npm run check
      - name: Enforce Code Principles for TypeScript and scripts
        run: npm run style:check
      - name: Server OAuth and MCP tests
        run: npm test
      - name: Real local D1 migration and Session binding SQL
        run: npm run test:d1:local
      - name: Cloudflare Worker bundle
        run: npm run build
      - name: Validate canonical production config and online smoke scripts
        run: |
          node --check scripts/PrepareProduction.mjs
          node --check scripts/GuardBindingD1.mjs
          node --check scripts/SmokeProduction.mjs
          node --check scripts/VerifyWorkerSecret.mjs
      - run: npm run audit:check

  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Studio FastMCP and test deps
        run: pip install './studio[dev]'
      - name: Check Python imports and style
        run: ruff check studio/src studio/tests --select E4,E7,E9,F
      - name: Install Chromium for browser acceptance
        run: python -m playwright install --with-deps chromium
      - name: Python Studio tests
        run: pytest -q studio/tests
      - name: Preview mcp_install desktop registration
        run: nuwa-relay-mcp install --print

  studio-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Studio Python package
        run: python -m pip install "./studio[dev]"
      - name: Install Chromium for browser acceptance
        run: python -m playwright install chromium
      - name: Test Studio on Windows
        run: python -m pytest -q studio/tests
      - name: Verify installed Studio CLI entrypoint
        run: nuwa-relay-mcp --version
      - name: Preview desktop registration on Windows
        run: nuwa-relay-mcp install --print

  studio-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and test tools
        run: python -m pip install uv "./studio[dev]"
      - name: Provision verified NSIS compiler
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "nsis-3.13.zip"
          $root = Join-Path $env:RUNNER_TEMP "nsis-3.13"
          $url = "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip"
          curl.exe --fail --location --retry 3 --retry-all-errors --max-time 45 $url --output $archive
          if ($LASTEXITCODE -ne 0) { throw "Could not download NSIS 3.13" }
          $expected = "ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8"
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected) {
            throw "NSIS archive SHA256 mismatch"
          }
          Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP -Force
          $compiler = Join-Path $root "bin\makensis.exe"
          if (-not (Test-Path $compiler -PathType Leaf)) { throw "NSIS compiler missing" }
          $env:NSISDIR = $root
          & $compiler /VERSION
          if ($LASTEXITCODE -ne 0) { throw "NSIS compiler failed version check" }
          "NSISDIR=$root" >> $env:GITHUB_ENV
          (Split-Path $compiler) >> $env:GITHUB_PATH
      - name: Install real Claude Code native CLI for Windows acceptance
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP "claude-cli"
          npm install --prefix $prefix --no-save --ignore-scripts @anthropic-ai/claude-code-win32-x64@2.1.331
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binaries = @(Get-ChildItem -Path $prefix -Recurse -File -Filter claude.exe)
          if ($binaries.Count -ne 1) { throw "Expected one native Claude Code executable" }
          $claude = $binaries[0].FullName
          & $claude --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "NUWA_TEST_CLAUDE_CLI=$claude" >> $env:GITHUB_ENV
      - name: Build standalone Relay MCP and Windows Setup
        run: python studio/Build.py
      - name: Verify real Setup install, upgrade, MCP stdio and uninstall
        shell: pwsh
        run: |
          $env:NUWA_TEST_WINDOWS_SETUP = (Resolve-Path studio/dist/nuwa-relay-mcp-setup.exe).Path
          python -m pytest -q studio/tests/test_windows_setup.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: nuwa-relay-mcp-windows-test-build
          path: |
            studio/dist/nuwa-relay-mcp.exe
            studio/dist/nuwa-relay-mcp-setup.exe
          if-no-files-found: error

  deploy:
    name: Deploy remote MCP to Cloudflare
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [server, studio, studio-windows, studio-windows-installer]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    concurrency:
      group: nuwa-agent-relay-mcp-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate Cloudflare deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required Cloudflare deployment secret: ${name}"
              exit 1
            fi
          done
      - name: Resolve canonical Session binding D1 with existing GitHub Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/PrepareProduction.mjs
      - name: Verify canonical Worker bundle without remote changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run --config .wrangler.deploy.jsonc --outdir .wrangler-production-check
      - name: Refuse legacy, mixed or unknown remote D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/GuardBindingD1.mjs --remote
      - name: Apply Session binding schema to the dedicated MCP D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply BINDINGS_DB --remote --config .wrangler.deploy.jsonc
      - name: Deploy official MCP Worker through original pipeline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
      - name: Verify the permanent Runtime encryption Worker Secret safely
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/VerifyWorkerSecret.mjs

  smoke:
    name: Verify live official MCP Skill and OAuth protection
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Test production OAuth discovery, Skill and invalid bearer denial
        run: node scripts/SmokeProduction.mjs
