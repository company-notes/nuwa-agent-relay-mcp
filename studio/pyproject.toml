[project]
name = "nuwa-agent-relay-studio-mcp"
version = "0.2.0"
description = "Installable Nuwa Agent Relay Studio MCP using FastMCP and mcp-install"
requires-python = ">=3.11"
dependencies = ["fastmcp==4.0.3", "httpx>=0.27,<1", "mcp-install==0.1.0"]

[project.scripts]
nuwa-agent-relay-mcp = "src.CLI:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/install.config.json" = "scripts/install.config.json"
